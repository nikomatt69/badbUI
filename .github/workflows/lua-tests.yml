name: Lua tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lua-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lua 5.1 (API WoW simulate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Lua 5.1
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1
      - name: Syntax check
        run: for f in $(git ls-files '*.lua'); do luac5.1 -p "$f" || exit 1; done
      - name: Tests
        run: lua5.1 tests/run.lua .
      - name: "Tests (suite stub: CVars, Nameplates, GroupFrames, Presets)"
        run: lua5.1 tests/run_stub.lua
      - name: Tests (design system UI)
        run: lua5.1 tests/ui/run.lua .
